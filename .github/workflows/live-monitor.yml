name: PAXGUSD ORB live monitor

on:
  schedule:
    # Every 5 minutes, all day, every day (GitHub's fastest allowed native
    # schedule interval - there is no faster native option). Not restricted to
    # the NY trading session: PAXGUSD trades 24/7 as a crypto perpetual, so
    # the price/equity chart stays live all day even though the strategy
    # itself only opens ranges/trades/alerts during its own session window.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the job can commit the updated logs back

concurrency:
  group: paxg-orb-monitor
  cancel-in-progress: false   # never cancel a run mid-write, just queue

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run monitor
        run: python delta_orb_action.py

      - name: Commit updated logs
        run: |
          git config user.name "orb-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in state.json live_log.txt alerts_log.csv trades_log.csv price_and_equity.csv SUMMARY.md; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Log update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
